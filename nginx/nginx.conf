events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Serve the mkcert root CA over plain HTTP so a client that does not yet
        # trust the CA can download it without first hitting a TLS warning. The
        # CA is a public trust anchor (contains no private key), so serving it
        # over HTTP is safe; on an untrusted network verify the fingerprint out
        # of band before importing.
        location = /rootCA.pem {
            root /etc/nginx/ca-bundle;
            default_type application/x-pem-file;
            add_header Content-Disposition 'attachment; filename="rootCA.pem"';
        }

        # Everything else is redirected to HTTPS.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Frontend
    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Also expose the root CA over HTTPS for clients that already trust it.
        location = /rootCA.pem {
            root /etc/nginx/ca-bundle;
            default_type application/x-pem-file;
            add_header Content-Disposition 'attachment; filename="rootCA.pem"';
        }

        location / {
            proxy_pass http://openstream-frontend:4173;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Backend API
    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        client_max_body_size 200M;

        location / {
            proxy_pass http://openstream:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Keycloak
    server {
        listen 8080 ssl;
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            proxy_pass http://openstream-keycloak:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Keycloak needs larger buffers for its headers
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }

    # MinIO S3 API
    server {
        listen 9443 ssl;
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        client_max_body_size 500M;

        location / {
            proxy_pass http://openstream-minio:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # MinIO Console
    server {
        listen 9444 ssl;
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            proxy_pass http://openstream-minio:9001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Polling server (SSE)
    server {
        listen 3000 ssl;
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            proxy_pass http://openstream-polling:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE requires no buffering and a long timeout
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }
    }

    # Collab server (WebSocket, multiplayer editing)
    server {
        listen 3001 ssl;
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            proxy_pass http://openstream-collab:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket upgrade — required for the y-websocket connection
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Keep long-lived editing sessions open
            proxy_read_timeout 86400s;
        }
    }
}
