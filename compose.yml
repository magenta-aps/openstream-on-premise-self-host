networks:
  openstream_net:

services:
  nginx:
    container_name: openstream-nginx
    image: nginx:alpine
    pull_policy: if_not_present
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "8443:8443"
      - "9443:9443"
      - "9444:9444"
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      # Root CA exported by scripts/export-ca; served at /rootCA.pem so clients
      # can download and trust it. Directory mount (not file) so it survives the
      # file not existing yet on first boot.
      - ./ca-bundle:/etc/nginx/ca-bundle:ro
    networks:
      - openstream_net
    depends_on:
      - openstream
      - frontend
      - keycloak
      - minio
      - polling-server
      - collab-server

  openstream:
    container_name: openstream
    image: magentaaps/openstream:7.13.5
    pull_policy: if_not_present
    env_file:
      - ./env/backend.env
    volumes:
      - ./realms.json:/app/realms.json:ro
    environment:
      # 'openstream' is the internal Docker service name; the collab-server
      # sidecar authorizes connections via http://openstream:8000, so its Host
      # header must be allowed.
      ALLOWED_HOSTS: "${SERVER_IP},localhost,openstream"
      CSRF_TRUSTED_ORIGINS: "https://${SERVER_IP},https://${SERVER_IP}:8443"
      KEYCLOAK_HOST: "${SERVER_IP}"
      CORS_ALLOWED_ORIGINS: "https://${SERVER_IP}"
      FRONTEND_HOST: "https://${SERVER_IP}"
      FRONTEND_PASSWORD_RESET_URL: "https://${SERVER_IP}/reset-password"
      MINIO_PUBLIC_URL: "https://${SERVER_IP}:9443"
      KEYCLOAK_REALM_BACKEND_BASE_URL: "https://${SERVER_IP}:8443"
    networks:
      - openstream_net
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

  cron:
    container_name: openstream-cron
    image: magentaaps/openstream:7.13.5
    pull_policy: if_not_present
    env_file:
      - ./env/backend.env
    environment:
      # 'openstream' is the internal Docker service name; the collab-server
      # sidecar authorizes connections via http://openstream:8000, so its Host
      # header must be allowed.
      ALLOWED_HOSTS: "${SERVER_IP},localhost,openstream"
      CSRF_TRUSTED_ORIGINS: "https://${SERVER_IP},https://${SERVER_IP}:8443"
      KEYCLOAK_HOST: "${SERVER_IP}"
      CORS_ALLOWED_ORIGINS: "https://${SERVER_IP}"
      FRONTEND_HOST: "https://${SERVER_IP}"
      FRONTEND_PASSWORD_RESET_URL: "https://${SERVER_IP}/reset-password"
      MINIO_PUBLIC_URL: "https://${SERVER_IP}:9443"
      KEYCLOAK_REALM_BACKEND_BASE_URL: "https://${SERVER_IP}:8443"
    networks:
      - openstream_net
    entrypoint: ["/usr/local/bin/supercronic", "/crontab"]
    depends_on:
      - openstream

  db:
    container_name: openstream-db
    image: docker.io/library/postgres:17
    pull_policy: if_not_present
    env_file:
      - ./env/db.env
    networks:
      - openstream_net
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:Z
      - ./scripts/initdb.sh:/docker-entrypoint-initdb.d/initdb.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openstream}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    container_name: openstream-keycloak
    image: docker.io/magentaaps/openstream-keycloak:0.2.5
    pull_policy: if_not_present
    entrypoint: ["/opt/keycloak/bin/kc.sh", "start-dev", "--import-realm"]
    environment:
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HOSTNAME: "https://${SERVER_IP}:8080"
    env_file:
      - ./env/keycloak.env
    networks:
      - openstream_net
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: openstream-frontend
    image: magentaaps/openstream-frontend:7.13.5
    pull_policy: if_not_present
    env_file:
      - ./env/frontend.env
    environment:
      BASE_URL: "https://${SERVER_IP}:8443"
      POLLING_URL: "https://${SERVER_IP}:3000/events"
      COLLAB_URL: "wss://${SERVER_IP}:3001"
    networks:
      - openstream_net
    depends_on:
      - openstream

  collab-server:
    container_name: openstream-collab
    image: magentaaps/openstream-collab:7.13.5
    pull_policy: if_not_present
    environment:
      NODE_ENV: production
      PORT: "3001"
      DJANGO_BASE_URL: "http://openstream:8000"
      # Shared secret with Django. MUST match COLLAB_SERVER_API_KEY in
      # env/backend.env. Required in production — the sidecar refuses to start
      # without it.
      COLLAB_SERVER_API_KEY: changeme_collab_key
      # Origins allowed to call POST /flush from the browser (comma-separated).
      # The editor calls it before publishing, to force the sidecar to write the
      # shared document back to Django so the published version is not stale.
      # It is cross-origin here: the page is served from https://${SERVER_IP}
      # and the sidecar answers on https://${SERVER_IP}:3001. Leaving this unset
      # reflects the request origin instead, which is also safe (the endpoint
      # takes an explicit Bearer token and never cookies, so it carries no
      # ambient authority) — but pin it, so a wrong frontend host fails loudly.
      COLLAB_ALLOWED_ORIGINS: "https://${SERVER_IP}"
      # How long POST /flush waits for the publishing editor's own edits to
      # arrive over its WebSocket before giving up and answering "sync-timeout".
      # The edits are sent before the HTTP call but travel on a different
      # connection, so ordering is not guaranteed. Raise it on a slow link.
      FLUSH_SYNC_TIMEOUT_MS: "2000"
    networks:
      - openstream_net
    depends_on:
      - openstream

  polling-server:
    container_name: openstream-polling
    image: magentaaps/openstream-polling:7.13.5
    pull_policy: if_not_present
    env_file:
      - ./env/polling.env
    networks:
      - openstream_net
    depends_on:
      - openstream

  minio:
    container_name: openstream-minio
    image: docker.io/minio/minio:latest
    pull_policy: if_not_present
    env_file:
      - ./env/minio.env
    environment:
      MINIO_BROWSER_REDIRECT_URL: "https://${SERVER_IP}:9444"
    networks:
      - openstream_net
    volumes:
      - ./data/minio:/data:Z
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    container_name: openstream-minio-init
    image: docker.io/minio/mc
    pull_policy: if_not_present
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - openstream_net
    env_file:
      - ./env/minio.env
    entrypoint: /bin/sh
    command: -c "/scripts/minio-init.sh"
    volumes:
      - ./scripts/minio-init.sh:/scripts/minio-init.sh:ro
